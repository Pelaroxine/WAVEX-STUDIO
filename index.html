<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAVEX-STUDIO | Digital Audio Workstation</title>
    <link rel="stylesheet" href="src/styles/theme.css">
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>

    <!-- Application Shell Header -->
    <header class="daw-header">
        <div class="brand-logo">
            WAVEX-STUDIO <span class="tag">DAW v1.0</span>
        </div>

        <div class="transport-bar">
            <button class="btn-transport" id="btnPlay">
                <span id="playIcon">▶</span> Play
            </button>
            <button class="btn-transport" id="btnStop">⏹ Stop</button>
            <div class="bpm-display">
                <span>BPM:</span>
                <strong id="bpmValue">120.00</strong>
            </div>
        </div>

        <div>
            <button class="btn-transport">⚙ Settings</button>
        </div>
    </header>

    <!-- Studio Main Workspace -->
    <main class="daw-workspace">
        <!-- Sidebar Browser -->
        <aside class="daw-browser">
            <div class="panel-header">Browser</div>
            <div class="browser-tree">
                <div class="browser-item">📁 Sample Packs</div>
                <div class="browser-item">📁 Instruments</div>
                <div class="browser-item">📁 Effect Presets</div>
                <div class="browser-item">📁 Saved Sessions</div>
            </div>
        </aside>

        <!-- Main View Router -->
        <section class="daw-main-view">
            <nav class="view-tabs">
                <button class="tab-btn active" data-view="mixer">Mixer</button>
                <button class="tab-btn" data-view="playlist">Playlist</button>
                <button class="tab-btn" data-view="pianoroll">Piano Roll</button>
            </nav>

            <div class="view-container" id="workspaceContainer">
                <!-- Active DAW view renders dynamically here -->
            </div>
        </section>
    </main>

    <script type="module" src="src/app/Shell.js"></script>
</body>
</html>
