<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAVEX-STUDIO | Mobile Digital Audio Workstation</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: #16181f;
            --panel-border: #262936;
            --accent-cyan: #00f0ff;
            --accent-orange: #ff6b00;
            --text-main: #f0f4f8;
            --text-dim: #7a8294;
            --knob-track: #222530;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        header {
            width: 100%;
            max-width: 920px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--panel-bg);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--panel-border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--accent-orange);
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .transport-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            background: #222632;
            color: var(--text-main);
            border: 1px solid #363b4e;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #2e3445;
        }

        button.active {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            border-color: var(--accent-cyan);
        }

        .mixer-container {
            width: 100%;
            max-width: 920px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 16px;
        }

        .channel-strip {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            width: 145px;
            min-width: 145px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 10px;
            gap: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }

        .channel-strip.master {
            background: #1c1f2b;
            border-color: var(--accent-orange);
        }

        .channel-title {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--accent-cyan);
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-strip.master .channel-title {
            color: var(--accent-orange);
        }

        .eq-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            background: #101218;
            padding: 10px 8px;
            border-radius: 8px;
        }

        .control-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--knob-track);
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
        }

        .fader-group {
            display: flex;
            gap: 10px;
            align-items: center;
            height: 180px;
            padding: 8px 0;
        }

        .fader {
            -webkit-appearance: none;
            writing-mode: bt-lr;
            appearance: slider-vertical;
            width: 24px;
            height: 160px;
            background: #101218;
            border-radius: 4px;
            outline: none;
        }

        .fader::-webkit-slider-thumb {
            width: 24px;
            height: 14px;
            background: #e0e0e0;
            border-radius: 3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .vu-meter {
            width: 8px;
            height: 160px;
            background: #101218;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
        }

        .vu-bar {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #00ff66 60%, #ffff00 85%, #ff0000 100%);
            transition: height 0.05s ease;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .btn-mute, .btn-solo {
            flex: 1;
            padding: 6px 0;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .btn-mute.active {
            background: #ff3b30;
            color: #fff;
            border-color: #ff3b30;
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.5);
        }

        .btn-solo.active {
            background: #ffcc00;
            color: #000;
            border-color: #ffcc00;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">WAVEX-STUDIO <span>DAW</span></div>
        <div class="transport-controls">
            <button id="playBtn">▶ Play Session</button>
        </div>
    </header>

    <div class="mixer-container">
        <!-- Track 01: Bass Synth -->
        <div class="channel-strip" data-track="0">
            <div class="channel-title">01 Bass</div>
            <div class="btn-group">
                <button class="btn-mute">M</button>
                <button class="btn-solo">S</button>
            </div>
            <div class="eq-group">
                <div class="control-label"><span>Hi</span><span class="val-hi">0</span></div>
                <input type="range" class="eq-hi" min="-12" max="12" value="0">
                <div class="control-label"><span>Mid</span><span class="val-mid">0</span></div>
                <input type="range" class="eq-mid" min="-12" max="12" value="0">
                <div class="control-label"><span>Low</span><span class="val-low">0</span></div>
                <input type="range" class="eq-low" min="-12" max="12" value="0">
            </div>
            <div class="fader-group">
                <input type="range" class="fader" min="0" max="1.2" step="0.01" value="0.8">
                <div class="vu-meter"><div class="vu-bar"></div></div>
            </div>
        </div>

        <!-- Track 02: Synth Chords -->
        <div class="channel-strip" data-track="1">
            <div class="channel-title">02 Chords</div>
            <div class="btn-group">
                <button class="btn-mute">M</button>
                <button class="btn-solo">S</button>
            </div>
            <div class="eq-group">
                <div class="control-label"><span>Hi</span><span class="val-hi">0</span></div>
                <input type="range" class="eq-hi" min="-12" max="12" value="0">
                <div class="control-label"><span>Mid</span><span class="val-mid">0</span></div>
                <input type="range" class="eq-mid" min="-12" max="12" value="0">
                <div class="control-label"><span>Low</span><span class="val-low">0</span></div>
                <input type="range" class="eq-low" min="-12" max="12" value="0">
            </div>
            <div class="fader-group">
                <input type="range" class="fader" min="0" max="1.2" step="0.01" value="0.8">
                <div class="vu-meter"><div class="vu-bar"></div></div>
            </div>
        </div>

        <!-- Track 03: Drums -->
        <div class="channel-strip" data-track="2">
            <div class="channel-title">03 Drums</div>
            <div class="btn-group">
                <button class="btn-mute">M</button>
                <button class="btn-solo">S</button>
            </div>
            <div class="eq-group">
                <div class="control-label"><span>Hi</span><span class="val-hi">0</span></div>
                <input type="range" class="eq-hi" min="-12" max="12" value="0">
                <div class="control-label"><span>Mid</span><span class="val-mid">0</span></div>
                <input type="range" class="eq-mid" min="-12" max="12" value="0">
                <div class="control-label"><span>Low</span><span class="val-low">0</span></div>
                <input type="range" class="eq-low" min="-12" max="12" value="0">
            </div>
            <div class="fader-group">
                <input type="range" class="fader" min="0" max="1.2" step="0.01" value="0.8">
                <div class="vu-meter"><div class="vu-bar"></div></div>
            </div>
        </div>

        <!-- Master Channel Bus -->
        <div class="channel-strip master" id="masterTrack">
            <div class="channel-title">MASTER</div>
            <div style="height: 30px;"></div>
            <div class="eq-group">
                <div class="control-label"><span>Hi</span><span class="val-hi">0</span></div>
                <input type="range" id="master-hi" min="-12" max="12" value="0">
                <div class="control-label"><span>Mid</span><span class="val-mid">0</span></div>
                <input type="range" id="master-mid" min="-12" max="12" value="0">
                <div class="control-label"><span>Low</span><span class="val-low">0</span></div>
                <input type="range" id="master-low" min="-12" max="12" value="0">
            </div>
            <div class="fader-group">
                <input type="range" class="fader" id="masterFader" min="0" max="1.2" step="0.01" value="0.9">
                <div class="vu-meter"><div class="vu-bar" id="masterVu"></div></div>
            </div>
        </div>
    </div>

    <script>
        let audioCtx;
        let isPlaying = false;
        let playInterval;

        const tracks = [
            { id: 0, gainNode: null, eqLow: null, eqMid: null, eqHi: null, mute: false, solo: false, level: 0 },
            { id: 1, gainNode: null, eqLow: null, eqMid: null, eqHi: null, mute: false, solo: false, level: 0 },
            { id: 2, gainNode: null, eqLow: null, eqMid: null, eqHi: null, mute: false, solo: false, level: 0 }
        ];

        let masterGain;
        let masterEqLow, masterEqMid, masterEqHi;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Master Bus Chain
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.9;

            masterEqLow = audioCtx.createBiquadFilter();
            masterEqLow.type = 'lowshelf';
            masterEqLow.frequency.value = 320;

            masterEqMid = audioCtx.createBiquadFilter();
            masterEqMid.type = 'peaking';
            masterEqMid.frequency.value = 1000;
            masterEqMid.Q.value = 0.5;

            masterEqHi = audioCtx.createBiquadFilter();
            masterEqHi.type = 'highshelf';
            masterEqHi.frequency.value = 3200;

            masterEqLow.connect(masterEqMid);
            masterEqMid.connect(masterEqHi);
            masterEqHi.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            // Channel Chains
            tracks.forEach((t) => {
                t.gainNode = audioCtx.createGain();
                t.gainNode.gain.value = 0.8;

                t.eqLow = audioCtx.createBiquadFilter();
                t.eqLow.type = 'lowshelf';
                t.eqLow.frequency.value = 320;

                t.eqMid = audioCtx.createBiquadFilter();
                t.eqMid.type = 'peaking';
                t.eqMid.frequency.value = 1000;
                t.eqMid.Q.value = 0.5;

                t.eqHi = audioCtx.createBiquadFilter();
                t.eqHi.type = 'highshelf';
                t.eqHi.frequency.value = 3200;

                t.eqLow.connect(t.eqMid);
                t.eqMid.connect(t.eqHi);
                t.eqHi.connect(t.gainNode);
                t.gainNode.connect(masterEqLow);
            });
        }

        let step = 0;
        function playStep() {
            if (!isPlaying) return;

            const time = audioCtx.currentTime;

            // Track 01: Bass Line
            if (!isTrackMuted(0)) {
                const notes = [65.41, 65.41, 73.42, 65.41];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(notes[step % notes.length], time);
                gain.gain.setValueAtTime(0.35, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
                osc.connect(gain);
                gain.connect(tracks[0].eqLow);
                osc.start(time);
                osc.stop(time + 0.22);
                tracks[0].level = 75;
            }

            // Track 02: Chords
            if (!isTrackMuted(1) && step % 2 === 0) {
                const freqs = [261.63, 329.63, 392.00];
                freqs.forEach(f => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, time);
                    gain.gain.setValueAtTime(0.12, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.38);
                    osc.connect(gain);
                    gain.connect(tracks[1].eqLow);
                    osc.start(time);
                    osc.stop(time + 0.38);
                });
                tracks[1].level = 68;
            }

            // Track 03: Drums
            if (!isTrackMuted(2)) {
                const noise = audioCtx.createBufferSource();
                const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.04, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 6500;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.18, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(tracks[2].eqLow);
                noise.start(time);
                tracks[2].level = 60;
            }

            step++;
        }

        function isTrackMuted(trackId) {
            const hasSolo = tracks.some(t => t.solo);
            if (hasSolo) {
                return !tracks[trackId].solo;
            }
            return tracks[trackId].mute;
        }

        const playBtn = document.getElementById('playBtn');
        playBtn.addEventListener('click', () => {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = '⏸ Pause Session';
                playBtn.classList.add('active');
                playInterval = setInterval(playStep, 250);
            } else {
                playBtn.textContent = '▶ Play Session';
                playBtn.classList.remove('active');
                clearInterval(playInterval);
            }
        });

        // UI Event Listeners
        document.querySelectorAll('.channel-strip[data-track]').forEach(strip => {
            const id = parseInt(strip.dataset.track);

            const muteBtn = strip.querySelector('.btn-mute');
            const soloBtn = strip.querySelector('.btn-solo');

            muteBtn.addEventListener('click', () => {
                tracks[id].mute = !tracks[id].mute;
                muteBtn.classList.toggle('active', tracks[id].mute);
            });

            soloBtn.addEventListener('click', () => {
                tracks[id].solo = !tracks[id].solo;
                soloBtn.classList.toggle('active', tracks[id].solo);
            });

            ['hi', 'mid', 'low'].forEach(type => {
                const input = strip.querySelector(`.eq-${type}`);
                const label = strip.querySelector(`.val-${type}`);
                input.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    label.textContent = val > 0 ? `+${val}` : val;
                    if (type === 'hi') tracks[id].eqHi.gain.value = val;
                    if (type === 'mid') tracks[id].eqMid.gain.value = val;
                    if (type === 'low') tracks[id].eqLow.gain.value = val;
                });
            });

            const fader = strip.querySelector('.fader');
            fader.addEventListener('input', (e) => {
                if (tracks[id].gainNode) {
                    tracks[id].gainNode.gain.value = parseFloat(e.target.value);
                }
            });
        });

        // Master Controls
        const masterStrip = document.getElementById('masterTrack');
        ['hi', 'mid', 'low'].forEach(type => {
            const input = masterStrip.querySelector(`#master-${type}`);
            const label = masterStrip.querySelector(`.val-${type}`);
            input.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                label.textContent = val > 0 ? `+${val}` : val;
                if (type === 'hi' && masterEqHi) masterEqHi.gain.value = val;
                if (type === 'mid' && masterEqMid) masterEqMid.gain.value = val;
                if (type === 'low' && masterEqLow) masterEqLow.gain.value = val;
            });
        });

        document.getElementById('masterFader').addEventListener('input', (e) => {
            if (masterGain) masterGain.gain.value = parseFloat(e.target.value);
        });

        // VU Meter Render Loop
        function updateVU() {
            if (isPlaying) {
                let maxMaster = 0;
                tracks.forEach((t) => {
                    const meter = document.querySelector(`.channel-strip[data-track="${t.id}"] .vu-bar`);
                    if (meter) {
                        const effectiveLevel = isTrackMuted(t.id) ? 0 : t.level;
                        meter.style.height = `${effectiveLevel}%`;
                        if (effectiveLevel > maxMaster) maxMaster = effectiveLevel;
                        t.level = Math.max(0, t.level - 8);
                    }
                });

                const masterMeter = document.getElementById('masterVu');
                if (masterMeter) {
                    masterMeter.style.height = `${maxMaster}%`;
                }
            } else {
                document.querySelectorAll('.vu-bar').forEach(bar => bar.style.height = '0%');
            }
            requestAnimationFrame(updateVU);
        }
        updateVU();
    </script>
</body>
</html>
